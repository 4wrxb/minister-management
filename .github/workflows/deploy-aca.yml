name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      action:
        description: 'Deployment action'
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - rollback
          - destroy
          - cleanup
      teardown_staging_on_production:
        description: 'Tear down staging after production deploy'
        required: false
        type: boolean
        default: true
      backup_blob_name:
        description: 'Rollback source backup blob name'
        required: false
        type: string
        default: ''
      backup_retention_days:
        description: 'Cleanup backup retention days'
        required: false
        type: string
        default: '7'

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/minister-management
  BICEP_DIR: infra
  SCRIPTS_DIR: scripts

jobs:
  # ─── Validate Configuration ──────────────────────────────────────
  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    outputs:
      resource-group: ${{ steps.rg-name.outputs.name }}
    steps:
      - name: Validate inputs
        run: |
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Action: ${{ github.event.inputs.action }}"
          echo "Tear down staging on production flow: ${{ github.event.inputs.teardown_staging_on_production }}"

          if [[ "${{ github.event.inputs.environment }}" != "staging" && "${{ github.event.inputs.environment }}" != "production" ]]; then
            echo "ERROR: Invalid environment"
            exit 1
          fi

          if [[ "${{ github.event.inputs.action }}" != "deploy" && "${{ github.event.inputs.action }}" != "rollback" && "${{ github.event.inputs.action }}" != "destroy" && "${{ github.event.inputs.action }}" != "cleanup" ]]; then
            echo "ERROR: Invalid action"
            exit 1
          fi

          if [[ "${{ github.event.inputs.action }}" == "rollback" && "${{ github.event.inputs.environment }}" != "production" ]]; then
            echo "ERROR: rollback is only supported for environment=production"
            exit 1
          fi

          if [[ "${{ github.event.inputs.action }}" == "destroy" && "${{ github.event.inputs.environment }}" != "staging" ]]; then
            echo "ERROR: destroy is only supported for environment=staging"
            exit 1
          fi

          if [[ "${{ github.event.inputs.action }}" == "cleanup" && "${{ github.event.inputs.environment }}" != "production" ]]; then
            echo "ERROR: cleanup is only supported for environment=production"
            exit 1
          fi

          if [[ "${{ github.event.inputs.action }}" == "cleanup" ]]; then
            DAYS="${{ github.event.inputs.backup_retention_days }}"
            if ! [[ "$DAYS" =~ ^[0-9]+$ ]] || [[ "$DAYS" -lt 1 ]]; then
              echo "ERROR: backup_retention_days must be a positive integer when action=cleanup"
              exit 1
            fi
          fi

          if [[ "${{ github.event.inputs.action }}" == "rollback" && -z "${{ github.event.inputs.backup_blob_name }}" ]]; then
            echo "ERROR: backup_blob_name is required when action=rollback"
            exit 1
          fi

      - name: Compute resource group name
        id: rg-name
        run: |
          ENV="${{ github.event.inputs.environment }}"
          RG="minister-rg-${ENV}"
          echo "name=${RG}" >> "$GITHUB_OUTPUT"
          echo "Resource Group: ${RG}"

  # ─── Lint & Validate Bicep ───────────────────────────────────────
  validate-bicep:
    name: Validate Bicep templates
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/
          bicep --version

      - name: Build (type-check) Bicep templates
        run: |
          set -euo pipefail
          echo "Building (type-checking) Bicep templates..."
          for f in main.bicep storage.bicep aca.bicep; do
            echo "  → ${BICEP_DIR}/${f}"
            bicep build "${BICEP_DIR}/${f}" --stdout > /dev/null
          done
          echo "✓ All Bicep templates parsed and type-checked successfully"

      - name: Lint Bicep templates
        run: |
          set -euo pipefail
          echo "Linting Bicep templates..."
          for f in main.bicep storage.bicep aca.bicep; do
            echo "  → ${BICEP_DIR}/${f}"
            bicep lint "${BICEP_DIR}/${f}"
          done
          echo "✓ Bicep lint complete"

  # ─── Build & Push Container Image ────────────────────────────────
  #
  # Note: this workflow intentionally does NOT re-run smoke / E2E tests.
  # docker-integration.yml (smoke-and-e2e) runs on every push to main,
  # so whenever this workflow is dispatched from main the same SHA has
  # already had its full test suite pass. Running them a second time
  # here would just duplicate work and add ~5 minutes per deploy.
  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'deploy' }}
    # validate-bicep is the gating quality check.
    needs: [validate-config, validate-bicep]
    # GITHUB_TOKEN needs packages:write to push to ghcr.io. On many repos
    # the org/user default for default_workflow_permissions is "read", so
    # we must request packages:write explicitly per-job. contents:read is
    # also declared because once any permissions block exists, omitted
    # scopes default to "none" (not "read").
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=minister-management-build
          cache-to: type=gha,mode=max,scope=minister-management-build
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Output image digest
        run: |
          echo "Image pushed successfully"
          echo "Digest: ${{ steps.push.outputs.digest }}"
          echo "Tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # ─── Verify GHCR Package Is Pullable ─────────────────────────────
  # ACA pulls images anonymously (no registry credentials configured),
  # so the GHCR package MUST be public. GitHub creates new packages as
  # private by default, so on the very first run of this workflow the
  # operator must visit the package settings and either:
  #   - flip visibility to Public, or
  #   - enable "Inherit access from source repository" (works because
  #     the Dockerfile has org.opencontainers.image.source pointing
  #     at this repo, so the package is auto-connected on first push).
  # This job fails fast with a clear message so we don't waste 5–10
  # minutes watching ACA bootstrap fail with a cryptic DENIED error.
  # See .github/DEPLOYMENT_WORKFLOW.md "Step 0" and DEPLOYMENT.md
  # Option 5 for the security audit and operator instructions.
  verify-package-visibility:
    name: Verify GHCR package is public
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'deploy' }}
    needs: build-image
    permissions:
      packages: read
    steps:
      - name: Check package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PKG: minister-management
        run: |
          set -eo pipefail

          # GitHub uses different endpoints for user-owned vs org-owned
          # packages. Probe the owner type from the public users API,
          # then call the matching packages endpoint.
          OWNER_TYPE=$(gh api "/users/${OWNER}" --jq '.type' 2>/dev/null || echo "")
          if [ "$OWNER_TYPE" = "Organization" ]; then
            ENDPOINT="/orgs/${OWNER}/packages/container/${PKG}"
            SETTINGS_URL="https://github.com/orgs/${OWNER}/packages/container/${PKG}/settings"
          else
            ENDPOINT="/users/${OWNER}/packages/container/${PKG}"
            SETTINGS_URL="https://github.com/users/${OWNER}/packages/container/${PKG}/settings"
          fi

          echo "Checking ${ENDPOINT} ..."

          if ! BODY=$(gh api "$ENDPOINT" 2>/dev/null); then
            echo "::error::GHCR package '${PKG}' not found under '${OWNER}', or the"
            echo "::error::workflow's GITHUB_TOKEN lacks 'packages: read' permission."
            echo "::error::On the very first deploy, this can happen if build-image"
            echo "::error::has not finished pushing yet — re-run after it succeeds."
            echo "::error::See DEPLOYMENT.md Option 5 Step 0."
            exit 1
          fi

          VISIBILITY=$(echo "$BODY" | jq -r '.visibility // "unknown"')
          echo "Package visibility: ${VISIBILITY}"

          if [ "$VISIBILITY" != "public" ]; then
            echo "::error::GHCR package '${PKG}' is '${VISIBILITY}' — ACA cannot pull it."
            echo "::error::Fix: open ${SETTINGS_URL}"
            echo "::error::      then either click 'Change visibility' → Public, OR"
            echo "::error::      enable 'Inherit access from source repository'"
            echo "::error::      (works because the Dockerfile sets image.source to this repo)."
            echo "::error::Re-run this workflow once the package is public."
            echo "::error::See DEPLOYMENT.md Option 5 Step 0 and"
            echo "::error::.github/DEPLOYMENT_WORKFLOW.md for the security audit"
            echo "::error::explaining why public GHCR is safe for this codebase."
            exit 1
          fi

          echo "✓ GHCR package is public — ACA will be able to pull it anonymously"

  # ─── Check/Bootstrap Resources ───────────────────────────────────
  bootstrap:
    name: Bootstrap resources if needed
    runs-on: ubuntu-latest
    needs: [validate-config, validate-bicep]
    if: ${{ github.event.inputs.action == 'deploy' }}
    outputs:
      rg-created: ${{ steps.check-rg.outputs.created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check if resource group exists
        id: check-rg
        run: |
          RG="${{ needs.validate-config.outputs.resource-group }}"
          if az group exists --name "$RG" | grep -q true; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "✓ Resource group $RG already exists"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Resource group $RG does not exist — will create"
          fi

      - name: Create resource group if missing
        if: steps.check-rg.outputs.created == 'true'
        run: |
          RG="${{ needs.validate-config.outputs.resource-group }}"
          LOCATION="eastus"
          az group create --name "$RG" --location "$LOCATION"
          echo "✓ Created resource group $RG in $LOCATION"

      - name: Store bootstrap state
        run: |
          echo "Bootstrap completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  # ─── Deploy to Staging ───────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [validate-config, build-image, verify-package-visibility, bootstrap]
    if: |
      github.event.inputs.action == 'deploy' && 
      github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure staging DB seeded from production snapshot
        run: |
          set -euo pipefail
          PROD_RG="minister-rg-production"
          RG="${{ needs.validate-config.outputs.resource-group }}"
          LOCATION="eastus"
          SHARE_NAME="minister-data"
          DB_PATH="minister.db"
          TMP_DB="/tmp/minister-production.db"
          SKIP_SEED="false"

          az deployment group create \
            --resource-group "$RG" \
            --name staging-storage-bootstrap \
            --template-file ${{ env.BICEP_DIR }}/storage.bicep \
            --parameters environmentName=staging location=$LOCATION > /dev/null

          if ! az group exists --name "$PROD_RG" | grep -q true; then
            echo "::warning::Skipping staging DB seed: production resource group '$PROD_RG' does not exist."
            SKIP_SEED="true"
          fi

          if [ "$SKIP_SEED" != "true" ] && ! az deployment group show --resource-group "$PROD_RG" --name main-deployment > /dev/null 2>&1; then
            echo "::warning::Skipping staging DB seed: production main-deployment is missing."
            SKIP_SEED="true"
          fi

          if [ "$SKIP_SEED" == "true" ]; then
            exit 0
          fi

          PROD_OUTPUTS=$(az deployment group show \
            --resource-group "$PROD_RG" \
            --name main-deployment \
            --query properties.outputs -o json 2>/dev/null || echo '{}')

          PROD_STORAGE=$(echo "$PROD_OUTPUTS" | jq -r '.storageAccountName.value // empty')
          if [ -z "$PROD_STORAGE" ]; then
            echo "ERROR: Could not resolve production storage account from main-deployment outputs."
            exit 1
          fi

          STAGING_OUTPUTS=$(az deployment group show \
            --resource-group "$RG" \
            --name staging-storage-bootstrap \
            --query properties.outputs -o json 2>/dev/null || echo '{}')

          STAGING_STORAGE=$(echo "$STAGING_OUTPUTS" | jq -r '.storageAccountName.value // empty')
          if [ -z "$STAGING_STORAGE" ]; then
            echo "ERROR: Could not resolve staging storage account from staging-storage-bootstrap outputs."
            exit 1
          fi

          PROD_KEY=$(az storage account keys list --resource-group "$PROD_RG" --account-name "$PROD_STORAGE" --query "[0].value" -o tsv)
          STAGING_KEY=$(az storage account keys list --resource-group "$RG" --account-name "$STAGING_STORAGE" --query "[0].value" -o tsv)

          DB_EXISTS=$(az storage file exists \
            --account-name "$PROD_STORAGE" \
            --account-key "$PROD_KEY" \
            --share-name "$SHARE_NAME" \
            --path "$DB_PATH" \
            --query exists -o tsv)

          if [ "$DB_EXISTS" != "true" ]; then
            echo "::warning::Skipping staging DB seed: production DB file '$DB_PATH' not found in '$PROD_STORAGE/$SHARE_NAME'."
            exit 0
          fi

          az storage file download \
            --account-name "$PROD_STORAGE" \
            --account-key "$PROD_KEY" \
            --share-name "$SHARE_NAME" \
            --path "$DB_PATH" \
            --dest "$TMP_DB" > /dev/null

          az storage file upload \
            --account-name "$STAGING_STORAGE" \
            --account-key "$STAGING_KEY" \
            --share-name "$SHARE_NAME" \
            --path "$DB_PATH" \
            --source "$TMP_DB" > /dev/null

          rm -f "$TMP_DB"
          echo "✓ Staging DB seeded from current production snapshot"

      - name: Deploy via Bicep
        id: deploy
        run: |
          RG="${{ needs.validate-config.outputs.resource-group }}"
          LOCATION="eastus"
          
          # Deploy by commit SHA so each deploy has a unique image reference.
          # If we deployed with a stable tag, Bicep would see the same
          # containerImage value as last run and
          # do nothing - ACA only creates a new revision when the image
          # reference string actually changes. The ':<sha>' tag is also
          # pushed by build-image and is what verify-package-visibility
          # confirms is pullable.
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Deploying image: $IMAGE"

          az deployment group create \
            --resource-group "$RG" \
            --name main-deployment \
            --template-file ${{ env.BICEP_DIR }}/main.bicep \
            --parameters \
              environmentName=staging \
              location=$LOCATION \
              containerImage="$IMAGE" \
              secretKey="${{ secrets.SECRET_KEY }}" \
              adminPassword="${{ secrets.ADMIN_PASSWORD }}" \
              ministerPassword="${{ secrets.MINISTER_PASSWORD }}" \
              urlPrefix="${{ secrets.URL_PREFIX || '' }}"
          
          # Extract outputs
          OUTPUTS=$(az deployment group show \
            --resource-group "$RG" \
            --name main-deployment \
            --query properties.outputs -o json)
          
          APP_URL=$(echo "$OUTPUTS" | jq -r '.containerAppUrl.value')
          echo "app-url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "✓ Deployed to $APP_URL"

      - name: Wait for app to be healthy
        run: |
          APP_URL="${{ steps.deploy.outputs.app-url }}"
          MAX_WAIT=300  # 5 minutes
          ELAPSED=0
          
          until curl -sf "${APP_URL}/health" > /dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "ERROR: App did not become healthy within ${MAX_WAIT}s"
              exit 1
            fi
            echo "Waiting for app to be healthy... (${ELAPSED}s elapsed)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          
          echo "✓ App is healthy at $APP_URL"

      - name: Run smoke tests against staging
        run: |
          APP_URL="${{ steps.deploy.outputs.app-url }}"
          
          # Test /health endpoint
          curl -sf "${APP_URL}/health" || exit 1
          echo "✓ /health endpoint working"
          
          # Test public endpoints
          curl -sf "${APP_URL}/api/settings/research-day" || exit 1
          echo "✓ /api/settings/research-day working"
          
          echo "✓ All smoke tests passed"

  # ─── Deploy to Production ────────────────────────────────────────
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [validate-config, build-image, verify-package-visibility, bootstrap]
    if: |
      github.event.inputs.environment == 'production' && 
      github.event.inputs.action == 'deploy'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Backup current database
        id: backup
        run: |
          set -euo pipefail
          RG="${{ needs.validate-config.outputs.resource-group }}"
          
          # Skip backup if this is the first deployment (no main-deployment exists yet).
          if ! az deployment group show --resource-group "$RG" --name main-deployment > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⊘ Skipping backup (first deploy — no existing database)"
            exit 0
          fi
          
          echo "skip=false" >> "$GITHUB_OUTPUT"
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          SHARE_NAME="minister-data"
          DB_PATH="minister.db"
          TMP_DB="/tmp/minister-production-backup.db"
          BACKUP_BLOB="prod-manual-backup-${TIMESTAMP}.db"

          OUTPUTS=$(az deployment group show \
            --resource-group "$RG" \
            --name main-deployment \
            --query properties.outputs -o json 2>/dev/null || echo '{}')

          STORAGE_ACCOUNT=$(echo "$OUTPUTS" | jq -r '.storageAccountName.value // empty')
          BACKUP_CONTAINER=$(echo "$OUTPUTS" | jq -r '.backupContainerName.value // "backups"')
          if [ -z "$STORAGE_ACCOUNT" ]; then
            echo "ERROR: Could not resolve production storage account from main-deployment outputs for backup."
            exit 1
          fi

          ACCOUNT_KEY=$(az storage account keys list --resource-group "$RG" --account-name "$STORAGE_ACCOUNT" --query "[0].value" -o tsv)
          DB_EXISTS=$(az storage file exists \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --share-name "$SHARE_NAME" \
            --path "$DB_PATH" \
            --query exists -o tsv)
          if [ "$DB_EXISTS" != "true" ]; then
            echo "ERROR: Production DB file '$DB_PATH' not found; aborting deploy."
            exit 1
          fi

          az storage file download \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --share-name "$SHARE_NAME" \
            --path "$DB_PATH" \
            --dest "$TMP_DB" > /dev/null

          az storage container create \
            --name "$BACKUP_CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" > /dev/null

          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --container-name "$BACKUP_CONTAINER" \
            --name "$BACKUP_BLOB" \
            --file "$TMP_DB" \
            --overwrite > /dev/null

          rm -f "$TMP_DB"
          echo "backup-blob=${BACKUP_BLOB}" >> "$GITHUB_OUTPUT"
          echo "backup-container=${BACKUP_CONTAINER}" >> "$GITHUB_OUTPUT"
          echo "✓ Production DB backup created: ${BACKUP_CONTAINER}/${BACKUP_BLOB}"

      - name: Deploy via Bicep to production
        id: deploy
        run: |
          RG="${{ needs.validate-config.outputs.resource-group }}"
          LOCATION="eastus"
          
          # Deploy by commit SHA. See deploy-staging for the rationale.
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Deploying image: $IMAGE"

          az deployment group create \
            --resource-group "$RG" \
            --name main-deployment \
            --template-file ${{ env.BICEP_DIR }}/main.bicep \
            --parameters \
              environmentName=production \
              location=$LOCATION \
              containerImage="$IMAGE" \
              secretKey="${{ secrets.SECRET_KEY }}" \
              adminPassword="${{ secrets.ADMIN_PASSWORD }}" \
              ministerPassword="${{ secrets.MINISTER_PASSWORD }}" \
              minReplicas=1 \
              maxReplicas=1 \
              urlPrefix="${{ secrets.URL_PREFIX || '' }}"
          
          OUTPUTS=$(az deployment group show \
            --resource-group "$RG" \
            --name main-deployment \
            --query properties.outputs -o json)
          
          APP_URL=$(echo "$OUTPUTS" | jq -r '.containerAppUrl.value')
          echo "app-url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "✓ Deployed to production: $APP_URL"

      - name: Health check (5 min timeout)
        id: health-check
        run: |
          APP_URL="${{ steps.deploy.outputs.app-url }}"
          MAX_WAIT=300
          ELAPSED=0
          
          until curl -sf "${APP_URL}/health" > /dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "::error::Health check failed after 5 minutes"
              exit 1
            fi
            echo "Health check... (${ELAPSED}s elapsed)"
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done
          
          echo "✓ Production app is healthy"

      - name: Log rollback pointer
        if: success() && steps.backup.outputs.backup-container != '' && steps.backup.outputs.backup-blob != ''
        run: |
          echo "Rollback backup blob: ${{ steps.backup.outputs.backup-container }}/${{ steps.backup.outputs.backup-blob }}"

  # ─── Manual Rollback (Production DB Restore) ─────────────────────
  rollback-production:
    name: Roll back production DB from backup
    runs-on: ubuntu-latest
    needs: [validate-config]
    if: |
      github.event.inputs.environment == 'production' &&
      github.event.inputs.action == 'rollback'
    environment:
      name: production
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restore backup blob into production database file
        run: |
          set -euo pipefail
          RG="${{ needs.validate-config.outputs.resource-group }}"
          SHARE_NAME="minister-data"
          DB_PATH="minister.db"
          TMP_DB="/tmp/minister-rollback.db"
          BACKUP_BLOB="${{ github.event.inputs.backup_blob_name }}"

          OUTPUTS=$(az deployment group show \
            --resource-group "$RG" \
            --name main-deployment \
            --query properties.outputs -o json 2>/dev/null || echo '{}')

          STORAGE_ACCOUNT=$(echo "$OUTPUTS" | jq -r '.storageAccountName.value // empty')
          BACKUP_CONTAINER=$(echo "$OUTPUTS" | jq -r '.backupContainerName.value // "backups"')
          if [ -z "$STORAGE_ACCOUNT" ]; then
            echo "ERROR: Could not resolve production storage account from main-deployment outputs for rollback."
            exit 1
          fi

          ACCOUNT_KEY=$(az storage account keys list --resource-group "$RG" --account-name "$STORAGE_ACCOUNT" --query "[0].value" -o tsv)

          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --container-name "$BACKUP_CONTAINER" \
            --name "$BACKUP_BLOB" \
            --file "$TMP_DB" > /dev/null

          az storage file upload \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --share-name "$SHARE_NAME" \
            --path "$DB_PATH" \
            --source "$TMP_DB" > /dev/null

          rm -f "$TMP_DB"
          echo "✓ Restored production DB from ${BACKUP_CONTAINER}/${BACKUP_BLOB}"

  # ─── Shared Staging Teardown ─────────────────────────────────────
  teardown-staging:
    name: Tear down staging resource group
    runs-on: ubuntu-latest
    needs: [validate-config, deploy-production]
    if: |
      always() && (
        (github.event.inputs.environment == 'staging' && github.event.inputs.action == 'destroy') ||
        (github.event.inputs.environment == 'production' &&
         github.event.inputs.action == 'deploy' &&
         github.event.inputs.teardown_staging_on_production == 'true' &&
         needs.deploy-production.result == 'success')
      )
    permissions:
      deployments: write
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete staging resource group
        run: |
          set -euo pipefail
          STAGING_RG="minister-rg-staging"
          if az group exists --name "$STAGING_RG" | grep -q true; then
            az group delete --name "$STAGING_RG" --yes
            echo "✓ Deleted staging resource group: $STAGING_RG"
          else
            echo "Staging RG not found; nothing to delete."
          fi

      - name: Mark staging GitHub environment as inactive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEPLOYMENTS=$(gh api --paginate "repos/${{ github.repository }}/deployments?environment=staging" \
            | jq -s '[.[].[] | .id]')
          COUNT=$(echo "$DEPLOYMENTS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "No staging deployments found in GitHub — nothing to deactivate."
            exit 0
          fi
          echo "$DEPLOYMENTS" | jq -r '.[]' | while read -r DEPLOY_ID; do
            gh api "repos/${{ github.repository }}/deployments/${DEPLOY_ID}/statuses" \
              --method POST \
              --field state=inactive \
              --silent
            echo "✓ Marked GitHub deployment $DEPLOY_ID (staging) as inactive"
          done

  # ─── Cleanup Production Cost Drivers ─────────────────────────────
  cleanup-production:
    name: Cleanup production cost drivers
    runs-on: ubuntu-latest
    needs: [validate-config]
    if: |
      github.event.inputs.environment == 'production' &&
      github.event.inputs.action == 'cleanup'
    environment:
      name: production
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Prune old production DB backup blobs
        run: |
          set -euo pipefail
          RG="${{ needs.validate-config.outputs.resource-group }}"
          RETENTION_DAYS="${{ github.event.inputs.backup_retention_days }}"
          CUTOFF_EPOCH=$(date -u -d "-${RETENTION_DAYS} days" +%s)

          OUTPUTS=$(az deployment group show \
            --resource-group "$RG" \
            --name main-deployment \
            --query properties.outputs -o json 2>/dev/null || echo '{}')

          STORAGE_ACCOUNT=$(echo "$OUTPUTS" | jq -r '.storageAccountName.value // empty')
          BACKUP_CONTAINER=$(echo "$OUTPUTS" | jq -r '.backupContainerName.value // "backups"')
          if [ -z "$STORAGE_ACCOUNT" ]; then
            echo "ERROR: Could not resolve production storage account from main-deployment outputs for cleanup."
            exit 1
          fi

          ACCOUNT_KEY=$(az storage account keys list --resource-group "$RG" --account-name "$STORAGE_ACCOUNT" --query "[0].value" -o tsv)
          CONTAINER_EXISTS=$(az storage container exists \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --name "$BACKUP_CONTAINER" \
            --query exists -o tsv 2>/dev/null || echo false)
          if [ "$CONTAINER_EXISTS" != "true" ]; then
            echo "No backup container named '$BACKUP_CONTAINER' found. Nothing to prune."
            exit 0
          fi

          BLOBS=$(az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --container-name "$BACKUP_CONTAINER" -o json)

          DELETED=0
          while IFS= read -r row; do
            NAME=$(echo "$row" | jq -r '.name')
            LAST_MODIFIED=$(echo "$row" | jq -r '.properties.lastModified')
            LAST_EPOCH=$(date -u -d "$LAST_MODIFIED" +%s)
            if [ "$LAST_EPOCH" -lt "$CUTOFF_EPOCH" ]; then
              az storage blob delete \
                --account-name "$STORAGE_ACCOUNT" \
                --account-key "$ACCOUNT_KEY" \
                --container-name "$BACKUP_CONTAINER" \
                --name "$NAME" > /dev/null
              DELETED=$((DELETED + 1))
            fi
          done < <(echo "$BLOBS" | jq -c '.[]')

          echo "✓ Deleted ${DELETED} backup blobs older than ${RETENTION_DAYS} days"

  # ─── Post-Deployment Checks ─────────────────────────────────────
  post-deployment-checks:
    name: Post-deployment checks
    runs-on: ubuntu-latest
    needs: [validate-config, deploy-staging, deploy-production]
    if: ${{ always() && ((github.event.inputs.environment == 'staging' && needs.deploy-staging.result == 'success') || (github.event.inputs.environment == 'production' && needs.deploy-production.result == 'success')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get deployment info
        run: |
          ENV="${{ github.event.inputs.environment }}"
          RG="minister-rg-${ENV}"
          
          # Get Container App details
          echo "=== Deployment Summary ==="
          echo "Environment: $ENV"
          echo "Deployment time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          
          OUTPUTS=$(az deployment group show \
            --resource-group "$RG" \
            --name main-deployment \
            --query properties.outputs -o json 2>/dev/null || echo '{}')
          
          echo "App URL: $(echo "$OUTPUTS" | jq -r '.containerAppUrl.value // "N/A"')"
          echo "Storage Account: $(echo "$OUTPUTS" | jq -r '.storageAccountName.value // "N/A"')"

      - name: Log deployment completion
        run: |
          echo "✓ Deployment completed successfully"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  # ─── Final Status ───────────────────────────────────────────────
  deployment-status:
    name: Deployment status
    runs-on: ubuntu-latest
    needs: [post-deployment-checks, rollback-production, teardown-staging, cleanup-production]
    if: always()
    steps:
      - name: Deployment result
        run: |
          ACTION="${{ github.event.inputs.action }}"
          ENV="${{ github.event.inputs.environment }}"

          if [[ "$ACTION" == "deploy" && "$ENV" == "staging" ]]; then
            [[ "${{ needs.post-deployment-checks.result }}" == "success" ]] && echo "✓ Staging deploy successful" && exit 0
            echo "✗ Staging deploy failed"
            exit 1
          fi

          if [[ "$ACTION" == "deploy" && "$ENV" == "production" ]]; then
            if [[ "${{ needs.post-deployment-checks.result }}" != "success" ]]; then
              echo "✗ Production deploy failed"
              exit 1
            fi
            if [[ "${{ github.event.inputs.teardown_staging_on_production }}" == "true" && "${{ needs['teardown-staging'].result }}" != "success" ]]; then
              echo "✗ Production deploy completed but requested staging teardown failed"
              exit 1
            fi
            echo "✓ Production deploy successful"
            exit 0
          fi

          if [[ "$ACTION" == "rollback" ]]; then
            [[ "${{ needs.rollback-production.result }}" == "success" ]] && echo "✓ Production rollback successful" && exit 0
            echo "✗ Production rollback failed"
            exit 1
          fi

          if [[ "$ACTION" == "destroy" ]]; then
            [[ "${{ needs['teardown-staging'].result }}" == "success" ]] && echo "✓ Staging destroy successful" && exit 0
            echo "✗ Staging destroy failed"
            exit 1
          fi

          if [[ "$ACTION" == "cleanup" ]]; then
            [[ "${{ needs.cleanup-production.result }}" == "success" ]] && echo "✓ Production cleanup successful" && exit 0
            echo "✗ Production cleanup failed"
            exit 1
          fi

          echo "✗ Unrecognized workflow outcome"
          exit 1
