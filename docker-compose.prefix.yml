version: '3.8'

# Compose override that hosts the app under a URL sub-path.
# Used in CI to verify that the same Docker image works at any prefix
# without a rebuild (runtime <base href> injection).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prefix.yml up -d --no-build --force-recreate
#
# The app then answers at http://localhost:8080/ministry/ (and /ministry/api/*).

services:
  app:
    environment:
      - URL_PREFIX=/ministry
